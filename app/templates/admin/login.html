<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rasbhav Books - Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f5f6fa;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;
        }

        .login-card {
            background: #ffffff;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: 700;

            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #111827;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 7px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;

            background: #fee2e2;
            color: #991b1b;

            padding: 12px;

            border-radius: 7px;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .success-message {
            display: none;

            background: #dcfce7;
            color: #166534;

            padding: 12px;

            border-radius: 7px;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .footer-text {
            text-align: center;

            color: #9ca3af;

            font-size: 12px;

            margin-top: 25px;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 25px 20px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            Rasbhav Books
        </div>

        <div class="subtitle">
            Admin Panel Login
        </div>


        <div
            class="error-message"
            id="errorMessage"
        ></div>


        <div
            class="success-message"
            id="successMessage"
        ></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <div class="footer-text">
            © Rasbhav Books
        </div>

    </div>

</div>


<script>

"use strict";


const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

    successMessage.style.display = "none";
}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(message) {

    successMessage.textContent = message;

    successMessage.style.display = "block";

    errorMessage.style.display = "none";
}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if (!username || !password) {

            showError(
                "Username and password are required."
            );

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try {

            const response =
                await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Login failed."
                );
            }


            showSuccess(
                "Login successful. Redirecting..."
            );


            setTimeout(
                function() {

                    window.location.href =
                        "/api/admin/panel";

                },
                500
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            showError(
                error.message ||
                "Unable to login."
            );

        } finally {

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";
        }

    }
);

</script>

</body>
</html>
